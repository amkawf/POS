version: "2"

sql:
  - engine: "postgresql"
    queries: "../internal/order/repository/queries"
    schema: "../migrations"
    gen:
      go:
        package: "orderdb"
        out: "../internal/order/repository/generated"
        sql_package: "pgx/v5"
  - engine: "postgresql"
    queries: "../internal/menu/repository/queries"
    schema: "../migrations"
    gen:
      go:
        package: "menudb"
        out: "../internal/menu/repository/generated"
        sql_package: "pgx/v5"
  - engine: "postgresql"
    queries: "../internal/table/repository/queries"
    schema: "../migrations"
    gen:
      go:
        package: "tabledb"
        out: "../internal/table/repository/generated"
        sql_package: "pgx/v5"
  - engine: "postgresql"
    queries: "../internal/kitchen/repository/queries"
    schema: "../migrations"
    gen:
      go:
        package: "kitchendb"
        out: "../internal/kitchen/repository/generated"
        sql_package: "pgx/v5"